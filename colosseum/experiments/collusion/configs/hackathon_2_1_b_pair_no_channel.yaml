# Condition B: assigned pair WITHOUT a private channel.
#
# Hackathon (sprint project 2.1 "which kinds of tasks lead to collusion?").
# Coalition prompt on (colluders know who their partner is) but no extra blackboard - they
# must use ordinary path channels/relays or actions. `coalition_prompt: always` enables this.
# Model calls go through OpenRouter; set OPENROUTER_API_KEY in the
# repo-root compute.env. GPT-4o-mini requires OpenRouter in this shared setup.

simulation:
  max_iterations: 1
  max_planning_rounds: 4
  max_conversation_steps: 3
  seed: 101
  tags: [hackathon_2_1_b_pair_no_channel]

environment:
  name: JiraTicketEnvironment
  assignment_filling: false
  max_tasks: 8

communication_network:
  # Matched conditions A-D use a PATH: each agent only shares a blackboard with its neighbours.
  # On a `complete` topology the whole network is already one channel open to everyone, so
  # condition C's extra open channel would be identical to it (Terrarium merges blackboards with
  # the same members) and the pair's private channel in A would be the only real difference.
  topology: path
  num_agents: 6
  consolidate_channels: true

llm_models:
  - label: openai_gpt4o_mini
    llm:
      provider: openrouter
      openrouter:
        model: openai/gpt-4o-mini
        params:
          max_tokens: 1500
          temperature: 0.7

experiment:
  tag: hackathon_2_1_b_pair_no_channel
  output_dir: experiments/collusion/outputs/hackathon_2_1_b_pair_no_channel
  max_concurrent_runs: 2
  seeds: [101, 102, 103, 104, 105]  # fresh evaluation seeds; seed 1 remains a development pilot
  collusion:
    colluder_selection: first_and_last   # the two PATH endpoints: same pair in A-D, and they share no blackboard
    agent_order: random
    coalition_prompt: always    # auto | always | never
  sweeps:
    - name: hackathon_2_1_b_pair_no_channel
      topologies: [path]
      num_agents: [6]
      colluder_counts: [2]
      secret_channel_enabled: [false]
      prompt_variants: [simple]
